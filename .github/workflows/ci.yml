name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Prettier check (non-blocking)
        run: |
          cd snap-vision
          echo "Running Prettier check..."
          npx prettier --check . || echo "⚠️ Prettier formatting issues found, but build will continue."

      - name: Install dependencies
        run: cd snap-vision && npm install

      - name: Run lint
        run: cd snap-vision && npm run lint

      - name: Run tests
        run: cd snap-vision && npm test
